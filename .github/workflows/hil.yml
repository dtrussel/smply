# SPDX-License-Identifier: Apache-2.0
#
# The hardware interoperability suite (P17), advisory.
#
# Runs ONLY on a self-hosted Windows runner labelled `smply-bench`, which has
# the NUCLEO-WB55RG on ST-LINK, a Bluetooth radio, STM32CubeProgrammer, the
# bench venv and the peer artefacts described in tests/hil/README.md. It stays
# advisory (continue-on-error) because a bench is not a PR gate (ADR-0015).
#
# A run that finds no bench reports its cases as "unavailable", not as passed.
#
# **NO RUNNER IS REGISTERED.** This workflow is committed so that commissioning
# one is a configuration step and not a code change. P18 reviewed it and left
# it uncommissioned -- that needs the physical bench -- and removed the nightly
# `schedule:` while doing so. The schedule was queueing a job every night
# against a runner that does not exist, which times out after 90 minutes and
# tells nobody anything; a standing reminder that only ever says the same thing
# is noise, and this comment is a cheaper one. `workflow_dispatch` remains, so
# the suite runs the moment somebody asks it to.
#
# To commission: register a self-hosted runner on the bench machine with the
# labels `self-hosted,windows,smply-bench`, set the four repository variables
# below, and restore the `schedule:` block:
#
#     schedule:
#       - cron: "17 2 * * *"   # nightly, after the fuzz soak
#
# Register it as a **service**, not an interactive session: the cross-check's
# HCI half needs BTVS running elevated, which a service can provide and a
# filtered-token interactive shell cannot (roadmap, P17c follow-up).
name: HIL (advisory)

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case names to run (comma-separated), or 'all'"
        default: "all"

jobs:
  hil:
    name: hardware cases on the bench
    runs-on: [self-hosted, windows, smply-bench]
    continue-on-error: true
    timeout-minutes: 90
    env:
      # Set on the runner, not here: where build_peer.py wrote its evidence/,
      # and how the bench is reached. See tests/hil/README.md.
      SMPLY_HIL_EVIDENCE: ${{ vars.SMPLY_HIL_EVIDENCE }}
      SMPLY_HIL_ADDRESS: ${{ vars.SMPLY_HIL_ADDRESS }}
      SMPLY_HIL_UART: ${{ vars.SMPLY_HIL_UART }}
      SMPLY_HIL_VENV: ${{ vars.SMPLY_HIL_VENV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build (windows-hil)
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Professional\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cmake --preset windows-hil
          cmake --build --preset windows-hil

      - name: Run the case suite
        shell: pwsh
        run: |
          & "$env:SMPLY_HIL_VENV\Scripts\python.exe" tests/hil/run_hil.py `
            --exe build/windows-hil/tests/hil/smply_hil.exe `
            --evidence "$env:SMPLY_HIL_EVIDENCE" `
            --address "$env:SMPLY_HIL_ADDRESS" `
            --uart "$env:SMPLY_HIL_UART" `
            --out build/hil-runs `
            --cases "${{ github.event.inputs.cases || 'all' }}"

      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-evidence-${{ github.run_id }}
          path: build/hil-runs
          if-no-files-found: warn
