# SPDX-License-Identifier: Apache-2.0
#
# OSV over the pinned dependency set, asked by commit.
#
# The weekly scan quality-gates.md section 9 describes.
#
# It is advisory, not a pull-request gate. A vulnerability disclosed in QCBOR
# on a Tuesday is real whether or not somebody happens to open a PR, and a job
# that blocks unrelated work on a finding it cannot fix is a job people learn
# to ignore. A finding is surfaced as a warning, in the run summary and in the
# JSON report; acting on it is a decision, and ADR-0011 says a dependency
# change needs one.
#
# What *does* fail this job is a scan that established nothing:
# tools/osv_query.py fails when the SBOM pins no commit, when the query fails,
# and when its canary -- a commit OSV is known to flag -- comes back clean.
#
# This job used to run OSV-Scanner over the SBOM. The scanner reads the
# dependencies' pkg:github PURLs and then drops both as "local/unscannable",
# so it was green having checked nothing. The script docstring has the detail.
name: osv-scan

on:
  schedule:
    # Mondays, 04:17 UTC -- after the nightly fuzz soak (03:17) has released
    # the runners, and offset off the hour like the other scheduled jobs.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # Also on any change to what is pinned, because that is the one moment a scan
  # can tell you something before you have shipped it -- and on any change to
  # the scan itself, so a change to it tests itself.
  push:
    paths:
      - "cmake/dependencies.cmake"
      - "docs/dependencies.md"
      - ".github/workflows/osv.yml"
      - "tools/osv_query.py"
      - "tools/sbom.py"

permissions:
  contents: read

jobs:
  scan:
    name: OSV by pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The SBOM is the input: it carries the exact commit each dependency is
      # pinned to, which is what determines whether an advisory applies.
      - name: Generate the SBOM
        run: python3 tools/sbom.py -o smply.spdx.json

      - name: Query OSV
        run: python3 tools/osv_query.py smply.spdx.json -o osv-report.json

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-report
          path: |
            osv-report.json
            smply.spdx.json
          if-no-files-found: ignore
