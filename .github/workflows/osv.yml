# SPDX-License-Identifier: Apache-2.0
#
# OSV-Scanner over the pinned dependency set.
#
# The weekly scan quality-gates.md section 9 describes.
#
# It is advisory, not a pull-request gate. A vulnerability disclosed in QCBOR
# on a Tuesday is real whether or not somebody happens to open a PR, and a job
# that blocks unrelated work on a finding it cannot fix is a job people learn
# to ignore. The finding is surfaced in the run summary and in the SARIF
# upload; acting on it is a decision, and ADR-0011 says a dependency change
# needs one.
#
# Its *scheduled* firing is still unproven -- this was written from a container
# with no way to fire a schedule, so the first Monday is its first evidence of
# that. The scan itself is proven: the push that added this file triggered it
# (osv.yml is in the paths filter below, deliberately, so the workflow tests
# itself), and the first attempt scanned nothing while reporting success. See
# the report check at the end of the job.
name: osv-scan

on:
  schedule:
    # Mondays, 04:17 UTC -- after the nightly fuzz soak (03:17) has released
    # the runners, and offset off the hour like the other scheduled jobs.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # Also on any change to what is pinned, because that is the one moment a scan
  # can tell you something before you have shipped it.
  push:
    paths:
      - "cmake/dependencies.cmake"
      - "docs/dependencies.md"
      - ".github/workflows/osv.yml"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: OSV-Scanner over the pinned set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The SBOM is the input: it carries the exact commit each dependency is
      # pinned to, which is what determines whether an advisory applies. Scanning
      # the working tree instead would scan whatever happened to be checked out.
      #
      # Written into the WORKSPACE, not runner.temp. The scanner action runs in
      # a Docker container that mounts the workspace at /github/workspace and
      # makes it the working directory; runner.temp is mounted somewhere else
      # under a different name, so a path built from it does not exist inside
      # the container. The first run of this workflow passed a runner.temp path
      # and the scanner answered "no such file or directory" -- see the failure
      # check below for why that was not noticed.
      - name: Generate the SBOM
        run: python3 tools/sbom.py -o smply.spdx.json

      # -L, not --sbom: the latter is deprecated in osv-scanner v2, and the
      # format is inferred from the .spdx.json suffix. Paths are relative to the
      # container's working directory, which is the workspace.
      #
      # --allow-no-lockfiles because an SBOM is not a lockfile and the scanner
      # otherwise exits non-zero for having found none. The flag suppresses that
      # and nothing else -- a package it *can* look up is still looked up, and
      # the report check below still requires a report to exist.
      - name: Scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            --format=sarif
            --output=osv.sarif
            --allow-no-lockfiles
            -L
            smply.spdx.json
        # A *finding* must not fail this job -- it is advisory, and acting on a
        # disclosure is a decision (ADR-0011). A scanner that could not run is a
        # different thing entirely, and the step below is what tells them apart.
        continue-on-error: true

      # The scan must have produced a report. Without this the job is green
      # whether it scanned the dependency set or nothing at all: on its first
      # run it read no SBOM, wrote no SARIF, exited 127, and reported success,
      # because continue-on-error above swallows every exit code equally.
      #
      # This is the same discipline tests/hil/tools/hci_capture.py applies to a
      # packet capture: a listener that attaches and records nothing is not a
      # capture, and only counting what it produced can tell the difference.
      - name: The scan must have produced a report
        run: |
          if [[ ! -s osv.sarif ]]; then
            echo "osv-scanner produced no SARIF: it did not scan anything." >&2
            echo "Check the scan step's log -- a usage or parse error exits" >&2
            echo "non-zero there and is swallowed by continue-on-error." >&2
            exit 1
          fi
          echo "osv.sarif: $(wc -c < osv.sarif) bytes"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-sarif
          path: osv.sarif
          if-no-files-found: ignore
