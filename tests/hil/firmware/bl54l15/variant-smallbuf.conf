#
# The BL54L15 peer's small-buffer variant (build_peer.py --variant smallbuf),
# applied after peer.conf. Zephyr's default netbuf instead of the sample's
# 2475 bytes (bt.conf), so that over the console a message's size is bounded
# by the device's buffer rather than by the client's 1024-byte cap: the
# setting under which A25's four bytes decide whether a message arrives
# (serial-smallbuf HIL case). The shell MTU (256) stays within 384 + 2.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=384
