#
# The BL54L15 DVK peer (tests/hil/README.md). Applied after the NCS v3.3.0
# smp_svr sample's own prj.conf and bt.conf, which already bring the BLE and
# shell (console UART) MCUmgr transports and, in prj.conf, the statistics group
# with the sample's registered `smp_svr_stats` group. The sample's main() does
# not auto-confirm a trial boot, which the rollback case depends on.
#
# Kept the same as the WB55 peer's peer.conf wherever the two can agree, so
# that a difference between the benches is a difference of board, not recipe.
CONFIG_BT_DEVICE_NAME="smply-hil-bl54l15"
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
# No file system: the FS and zbasic groups are out of smply's scope, and the
# storage partition is wanted for settings below.
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
# Boot and MCUmgr logs on uart20 (a J-Link VCOM), captured per case.
CONFIG_LOG_BACKEND_UART=y
# The settings group (3), for the stat/settings HIL cases (roadmap). ZMS is
# the settings back-end Zephyr picks when it is enabled; it suits the RRAM.
# No access hook: without CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK every key is
# readable and writable (settings_mgmt.c).
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_MCUMGR_GRP_SETTINGS=y
# The bench's own additions, from bench_module/ (passed to the build as an
# extra Zephyr module by build_peer.py); the sample itself stays unmodified.
# Settings: stock smp_svr registers no handler with a getter, so without it
# every settings read fails.
CONFIG_SMPLY_BENCH_SETTINGS=y
# A 64-bit statistics group, so A28's 32-bit truncation is observable.
CONFIG_SMPLY_BENCH_STATS=y
# BLE link parameter logging, for the throughput investigation. Its two
# BT_USER_* options would otherwise turn automatic data length update OFF
# (BT_AUTO_DATA_LEN_UPDATE defaults to y only without BT_USER_DATA_LEN_UPDATE),
# which would change the link being measured -- so that is pinned to what the
# peer had before.
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_SMPLY_BENCH_BLE_LOG=y
