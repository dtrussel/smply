#
# Sysbuild options for the BL54L15 DVK peer, merged after the smp_svr sample's
# own sysbuild.conf (which enables MCUboot).
#
# The swap mode is set explicitly even though it is NCS's default: the
# rollback case needs a bootloader that can revert a trial boot, and a recipe
# that relied on a default would silently stop testing that if the default
# moved (overwrite-only, for one, cannot revert).
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
# Key in the image, not in the KMU: a KMU-held key has to be provisioned at
# every full erase, and the baseline flash erases everything. The signing key
# stays NCS's public development key, which is only appropriate for a bench.
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=n
