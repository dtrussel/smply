#
# Applied after the pinned smp_svr sample's own bt.conf. The sample's main()
# does not auto-confirm a trial boot, which the rollback case depends on.
CONFIG_BT_DEVICE_NAME="smply-p17-wb55"
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
# No file system on this peer: the FS and zbasic groups are out of smply's scope
# and littlefs would need a partition the WB55 layout does not spare.
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
# Boot and MCUmgr logs on USART1 (the ST-LINK VCP), captured per case.
CONFIG_LOG_BACKEND_UART=y
